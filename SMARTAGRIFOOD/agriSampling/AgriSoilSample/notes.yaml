notesHeader: |
  AgriSoilSample is one physical soil sample from one depth interval (depthFrom to depthTo, in meters): a single core at a Point, or a composite of several cores over a Polygon, typically one per management zone (hasAgriManagementZone).
notesMiddle: |
  Contents are fractions between 0 and 1 (not percentages). Concentrations are in mg/kg of dry soil. Each extractable nutrient carries its extraction method (phosphorusMethod, potassiumMethod), which is required whenever the value is present, because results from different methods are not comparable. Parameters without a dedicated property go to otherResults with a UN/CEFACT unit code.
notesFooter: |
  A sample with several layers is several entities, one per depth interval.
notesReadme: |
  Soil sample (single core or composite) from one depth interval with its laboratory results.
