notesHeader: |
  AgriPlant describes one individual plant that is identified and located in the field and followed over time (for example a marked olive tree sampled every year). It points to its parcel (hasAgriParcel) and to the plantation it belongs to (hasAgriCrop).
notesMiddle: |
  The plantation, described by AgriCrop, stays the unit of the crop cycle. Removing or replacing one plant does not end the plantation. A replacement plant is a new AgriPlant entity; the old one gets plantStatus replaced and points to the new one with hasAgriPlantReplacement, so its sampling history is kept.
notesFooter: |
  Samples taken from the plant (AgriPlantSample) refer to it with hasAgriPlant.
notesReadme: |
  Individual plant (tree, vine or shrub) identified, located and followed over time.
