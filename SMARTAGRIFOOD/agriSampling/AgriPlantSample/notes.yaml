notesHeader: |
  AgriPlantSample is one physical sample of plant tissue with its laboratory results. It can come from one plant (hasAgriPlant), from a set of marked plants (hasAgriPlant as a list), or be a composite that represents a management zone (hasAgriManagementZone) or a parcel (hasAgriParcel). At least one of these three relationships is required.
notesMiddle: |
  Results are on a dry-matter basis. Macronutrients are fractions between 0 and 1 (not percentages); micronutrients and sodium are in mg/kg. Parameters without a dedicated property go to otherResults with a UN/CEFACT unit code. The phenological stage is preferably a BBCH code, since the nutrient content of leaves depends on it.
notesFooter: |
  A plant sampled every year has one AgriPlantSample per sampling date.
notesReadme: |
  Plant tissue sample (single plant, marked plants or composite) with its laboratory results.
