notesHeader: |
  AgriManagementZone covers zones that are drawn by hand (for example the blocks of an experimental design) and zones derived by a method (vegetation index clustering, terrain, topographic wetness, soil survey, yield map). The method is stated in zoningMethod instead of using one entity type per method.
notesMiddle: |
  All the zones of one zoning run share zoningRunId; a new run replaces the previous one. A dose or prescription rate is not a property of the zone: it belongs to the prescription or operation that uses the zone.
notesFooter: |
  Samples (AgriSoilSample, AgriPlantSample) refer to a zone with hasAgriManagementZone.
notesReadme: |
  Zone inside an agricultural parcel, drawn or derived, used for per-zone sampling and variable-rate application.
