name: DataProvider
description: >
  A technical agent (ETL, connector, ingestion service) that injects
  DigitalAssetMetric observations into the data space. Decoupled from
  Organization so that the same metric for the same channel on the same day
  can be supplied by multiple providers (e.g. an internal pipeline and a
  third-party agency) and remain distinguishable in the historic.
version: 0.0.1
status: incubated
contributors:
  - LIN3S
