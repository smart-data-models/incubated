name: DigitalAssetMetric
description: >
  A digital marketing observation of a DigitalAsset for a specific date and
  temporal granularity (P1D / P1M / P3M / P1Y). Includes traffic, engagement,
  e-commerce, organic-social and paid-ads metrics. Metrics that admit
  breakdown by acquisition channel group are arrays of {channelGroup, value};
  the rest are scalars. The schema is sparse: non-applicable metrics are
  simply omitted.
version: 0.0.1
status: incubated
contributors:
  - LIN3S
references:
  - https://en.wikipedia.org/wiki/ISO_8601#Durations
  - https://unece.org/trade/uncefact/cl-recommendations
  - https://en.wikipedia.org/wiki/ISO_4217
