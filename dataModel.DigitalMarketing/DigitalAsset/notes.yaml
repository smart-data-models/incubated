name: DigitalAsset
description: >
  A concrete digital asset (web site, mobile app, social media profile, search
  engine listing, paid-ads account, etc.) that belongs to a Brand and is
  observed through a specific SoftwareApplication. One Brand can group several
  DigitalAssets; each channel is observed by exactly one SoftwareApplication.
version: 0.0.1
status: incubated
contributors:
  - LIN3S
references:
  - https://schema.org/SoftwareApplication
