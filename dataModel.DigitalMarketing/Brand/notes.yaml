name: Brand
description: >
  A brand operated by a legal organization. Represents a commercial identity
  (name, sector) decoupled from the legal entity (Organization) so that a
  single Organization can operate several Brands and one Brand can group
  several DigitalAssets (web, app, social profiles).
version: 0.0.1
status: incubated
contributors:
  - LIN3S
references:
  - https://schema.org/Brand
  - https://ec.europa.eu/eurostat/web/nace
